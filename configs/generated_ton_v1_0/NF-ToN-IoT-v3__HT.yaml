experiment:
  name: E1_TDIM_MSB_SMOKE
  profile: E1_FINAL_CORE_FULL_STREAM_v1_0_NF-ToN-IoT-v3_HT
  seeds:
  - 123456789
  - 234567891
  - 345678912
  - 456789123
  - 567891234
  deterministic_seed: 123456789
dataset:
  path: __AUTO__
  label_column: Attack
  timestamp_column: FLOW_START_MILLISECONDS
  class_names:
  - Benign
  - scanning
  - dos
  - injection
  - ddos
  - password
  - xss
  - ransomware
  - Backdoor
  - mitm
  row_start: 0
  max_rows: null
  require_timestamp: true
  validate_chronology: true
  chronology_tolerance: 0
  feature_include:
  - L4_SRC_PORT
  - L4_DST_PORT
  - PROTOCOL
  - L7_PROTO
  - IN_BYTES
  - IN_PKTS
  - OUT_BYTES
  - OUT_PKTS
  - TCP_FLAGS
  - CLIENT_TCP_FLAGS
  - SERVER_TCP_FLAGS
  - FLOW_DURATION_MILLISECONDS
  - DURATION_IN
  - DURATION_OUT
  - MIN_TTL
  - MAX_TTL
  - LONGEST_FLOW_PKT
  - SHORTEST_FLOW_PKT
  - MIN_IP_PKT_LEN
  - MAX_IP_PKT_LEN
  - SRC_TO_DST_SECOND_BYTES
  - DST_TO_SRC_SECOND_BYTES
  - RETRANSMITTED_IN_BYTES
  - RETRANSMITTED_IN_PKTS
  - RETRANSMITTED_OUT_BYTES
  - RETRANSMITTED_OUT_PKTS
  - SRC_TO_DST_AVG_THROUGHPUT
  - DST_TO_SRC_AVG_THROUGHPUT
  - NUM_PKTS_UP_TO_128_BYTES
  - NUM_PKTS_128_TO_256_BYTES
  - NUM_PKTS_256_TO_512_BYTES
  - NUM_PKTS_512_TO_1024_BYTES
  - NUM_PKTS_1024_TO_1514_BYTES
  - TCP_WIN_MAX_IN
  - TCP_WIN_MAX_OUT
  - ICMP_TYPE
  - ICMP_IPV4_TYPE
  - DNS_QUERY_ID
  - DNS_QUERY_TYPE
  - DNS_TTL_ANSWER
  - FTP_COMMAND_RET_CODE
  - SRC_TO_DST_IAT_MIN
  - SRC_TO_DST_IAT_MAX
  - SRC_TO_DST_IAT_AVG
  - SRC_TO_DST_IAT_STDDEV
  - DST_TO_SRC_IAT_MIN
  - DST_TO_SRC_IAT_MAX
  - DST_TO_SRC_IAT_AVG
  - DST_TO_SRC_IAT_STDDEV
  feature_exclude:
  - FLOW_END_MILLISECONDS
  numeric_features_only: true
  drop_ip_addresses: true
  drop_identifier_columns: true
  batch_size: 200000
  use_threads: false
  memory_map: true
  pre_buffer: false
evaluation:
  block_size: 50000
  rolling_windows:
  - 250000
  - 500000
  - 1000000
  checkpoint_every: 1000000
  resource_log_every: 50000
  store_classwise_metrics: true
  store_confusion_matrices: true
models:
  algorithms:
  - HT
  ensemble_size: 5
  class_size_theta: 0.9
  class_size_floor: 1.0e-12
  moob_lambda_cap: null
  ht:
    grace_period: 200
    max_depth: 20
    split_criterion: info_gain
    delta: 1.0e-07
    tau: 0.05
    leaf_prediction: nba
    nb_threshold: 0
    binary_split: false
    max_size: 64.0
    memory_estimate_period: 250000
    stop_mem_management: false
    remove_poor_attrs: true
    merit_preprune: true
runtime:
  output_root: __AUTO__
  resume: true
  overwrite: false
  fail_on_nonfinite: false
  prediction_fallback: benign_then_majority
  gc_every_blocks: 20
  log_level: INFO
